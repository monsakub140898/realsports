<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REALSPORTS - Live Scores & Standings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { createClient } from "https://esm.sh/@libsql/client@0.6.0/web";
        window.createLibsqlClient = createClient;
    </script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 font-sans pb-20">
    <div class="max-w-md mx-auto space-y-4">
        <!-- Header -->
        <div class="flex justify-between items-center py-2">
            <h1 class="text-2xl font-bold tracking-wider text-sky-400">REALSPORTS</h1>
            <button onclick="toggleSettings()" class="bg-slate-800 text-xs px-3 py-1.5 rounded-lg border border-slate-700 hover:bg-slate-700">
                ⚙️ ตั้งค่าทีมโปรด
            </button>
        </div>

        <!-- Pinned Settings Panel -->
        <div id="settings-panel" class="hidden bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-2">
            <label class="block text-xs text-slate-400">พิมพ์ชื่อทีมโปรดที่ต้องการปักหมุด:</label>
            <input type="text" id="fav-input" placeholder="เช่น Real Madrid, Arsenal..." 
                   class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-500">
            <button onclick="saveFavTeam()" class="w-full bg-sky-600 text-white text-sm py-1.5 rounded-lg font-medium hover:bg-sky-500">บันทึก</button>
        </div>

        <!-- TAB 1: MATCHES VIEW -->
        <div id="view-matches" class="space-y-4">
            <!-- Pinned Matches -->
            <div id="pinned-container" class="bg-indigo-950/60 border border-indigo-500/30 p-3 rounded-xl hidden">
                <div class="text-xs font-bold text-amber-400 mb-2">📌 ทีมโปรดของคุณ</div>
                <div id="pinned-matches" class="space-y-2"></div>
            </div>

            <!-- League Filter Tabs -->
            <div id="league-filters" class="flex gap-2 overflow-x-auto pb-1 text-xs"></div>

            <!-- Matches List -->
            <div id="matches-container" class="space-y-2">
                <div class="text-center py-8 text-slate-500 text-sm">กำลังเชื่อมต่อฐานข้อมูล...</div>
            </div>
        </div>

        <!-- TAB 2: STANDINGS VIEW -->
        <div id="view-standings" class="hidden space-y-4">
            <!-- Standings League Selector -->
            <div id="standings-tabs" class="flex gap-2 overflow-x-auto pb-1 text-xs"></div>

            <!-- Standings Table -->
            <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
                <table class="w-full text-left text-xs">
                    <thead class="bg-slate-950 text-slate-400">
                        <tr>
                            <th class="p-2.5 text-center">#</th>
                            <th class="p-2.5">ทีม</th>
                            <th class="p-2.5 text-center">แข่ง</th>
                            <th class="p-2.5 text-center">GD</th>
                            <th class="p-2.5 text-center font-bold text-sky-400">แต้ม</th>
                        </tr>
                    </thead>
                    <tbody id="standings-body" class="divide-y divide-slate-700/50">
                        <tr><td colspan="5" class="text-center py-6 text-slate-500">กำลังโหลด...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-slate-950/90 backdrop-blur border-t border-slate-800 p-2 flex justify-around max-w-md mx-auto">
        <button id="nav-matches" onclick="switchTab('matches')" class="flex flex-col items-center text-sky-400 text-xs font-semibold">
            <span class="text-lg">⚽</span> ผลบอลสด
        </button>
        <button id="nav-standings" onclick="switchTab('standings')" class="flex flex-col items-center text-slate-400 text-xs font-semibold">
            <span class="text-lg">📊</span> ตารางคะแนน
        </button>
    </div>

    <script>
        const TURSO_URL = "https://realsports-db-pponnsp.aws-ap-northeast-1.turso.io";
        const TURSO_TOKEN = "ใส่_READ_ONLY_TOKEN_ของคุณพล"; 

        let db = null;
        let allMatches = [];
        let selectedLeague = 'ALL';
        let currentStandingsLeague = 'PL';

        async function initDB() {
            if (window.createLibsqlClient) {
                db = window.createLibsqlClient({
                    url: TURSO_URL,
                    authToken: TURSO_TOKEN
                });
                renderLeagueFilters();
                await fetchRealMatches();
            } else {
                setTimeout(initDB, 200);
            }
        }

        async function fetchRealMatches() {
            try {
                const res = await db.execute("SELECT * FROM matches ORDER BY id DESC");
                allMatches = res.rows;
                renderMatches();
            } catch (err) {
                console.error("Fetch matches error:", err);
                document.getElementById('matches-container').innerHTML = 
                    `<div class="text-center py-8 text-slate-500 text-sm">ไม่มีข้อมูลการแข่งขันวันนี้</div>`;
            }
        }

        function renderLeagueFilters() {
            const leagues = [
                { code: 'ALL', name: 'ทั้งหมด' },
                { code: 'Premier League', name: 'พรีเมียร์ลีก' },
                { code: 'La Liga', name: 'ลาลีกา' },
                { code: 'Bundesliga', name: 'บุนเดสลีกา' },
                { code: 'Serie A', name: 'กัลโช่' },
                { code: 'Ligue 1', name: 'ลีกเอิง' }
            ];

            const container = document.getElementById('league-filters');
            container.innerHTML = leagues.map(l => `
                <button onclick="filterByLeague('${l.code}')" 
                        class="px-3 py-1.5 rounded-full whitespace-nowrap transition-all ${selectedLeague === l.code ? 'bg-sky-500 text-white font-bold' : 'bg-slate-800 text-slate-400 border border-slate-700'}">
                    ${l.name}
                </button>
            `).join('');
        }

        function filterByLeague(code) {
            selectedLeague = code;
            renderLeagueFilters();
            renderMatches();
        }

        function renderMatches() {
            const favTeam = localStorage.getItem('favTeam')?.toLowerCase();
            const container = document.getElementById('matches-container');
            const pinnedContainer = document.getElementById('pinned-container');
            const pinnedMatchesDiv = document.getElementById('pinned-matches');

            let pinned = (favTeam && allMatches.length > 0) 
                ? allMatches.filter(m => m.home_team.toLowerCase().includes(favTeam) || m.away_team.toLowerCase().includes(favTeam)) 
                : [];

            if (pinned.length > 0) {
                pinnedContainer.classList.remove('hidden');
                pinnedMatchesDiv.innerHTML = pinned.map(createMatchCard).join('');
            } else {
                pinnedContainer.classList.add('hidden');
            }

            let filteredMatches = allMatches;
            if (selectedLeague !== 'ALL') {
                filteredMatches = allMatches.filter(m => m.league_name === selectedLeague);
            }

            if (filteredMatches.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-500 text-sm">ไม่มีรายการแข่งขันในลีกนี้</div>`;
            } else {
                container.innerHTML = filteredMatches.map(createMatchCard).join('');
            }
        }

        function createMatchCard(m) {
            return `
                <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 flex items-center justify-between">
                    <div class="text-xs text-slate-400 w-20 truncate">${m.league_name}</div>
                    <div class="flex-1 text-center font-semibold text-sm">
                        <span>${m.home_team}</span>
                        <span class="bg-slate-900 px-2 py-1 rounded mx-2 text-sky-400">${m.home_score ?? 0} - ${m.away_score ?? 0}</span>
                        <span>${m.away_team}</span>
                    </div>
                    <div class="text-xs font-bold ${m.status === 'IN_PLAY' ? 'text-emerald-400' : 'text-slate-400'} w-12 text-right">
                        ${m.status === 'IN_PLAY' ? 'LIVE' : 'VS'}
                    </div>
                </div>
            `;
        }

        function renderStandingsTabs() {
            const leagues = [
                { code: 'PL', name: 'พรีเมียร์ลีก' },
                { code: 'PD', name: 'ลาลีกา' },
                { code: 'BL1', name: 'บุนเดสลีกา' },
                { code: 'SA', name: 'กัลโช่' },
                { code: 'FL1', name: 'ลีกเอิง' }
            ];

            const container = document.getElementById('standings-tabs');
            container.innerHTML = leagues.map(l => `
                <button onclick="loadStandings('${l.code}')" 
                        class="px-3 py-1.5 rounded-full whitespace-nowrap transition-all ${currentStandingsLeague === l.code ? 'bg-sky-500 text-white font-bold' : 'bg-slate-800 text-slate-400 border border-slate-700'}">
                    ${l.name}
                </button>
            `).join('');
        }

        async function loadStandings(leagueCode) {
            currentStandingsLeague = leagueCode;
            renderStandingsTabs();

            const body = document.getElementById('standings-body');
            body.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-slate-500">กำลังโหลด...</td></tr>`;

            try {
                const res = await db.execute({
                    sql: "SELECT * FROM standings WHERE league_code = ? ORDER BY position ASC",
                    args: [leagueCode]
                });
                
                if (res.rows.length === 0) {
                    body.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-slate-500">ยังไม่มีข้อมูลตารางคะแนน</td></tr>`;
                    return;
                }

                body.innerHTML = res.rows.map(row => `
                    <tr class="hover:bg-slate-700/30">
                        <td class="p-2.5 text-center font-bold ${row.position <= 4 ? 'text-sky-400' : 'text-slate-400'}">${row.position}</td>
                        <td class="p-2.5 font-semibold">${row.team_name}</td>
                        <td class="p-2.5 text-center text-slate-400">${row.played}</td>
                        <td class="p-2.5 text-center text-slate-400">${row.goals_for - row.goals_against}</td>
                        <td class="p-2.5 text-center font-bold text-sky-400">${row.points}</td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error("Fetch standings error:", err);
            }
        }

        function switchTab(tab) {
            if (tab === 'matches') {
                document.getElementById('view-matches').classList.remove('hidden');
                document.getElementById('view-standings').classList.add('hidden');
                document.getElementById('nav-matches').className = 'flex flex-col items-center text-sky-400 text-xs font-semibold';
                document.getElementById('nav-standings').className = 'flex flex-col items-center text-slate-400 text-xs font-semibold';
            } else {
                document.getElementById('view-matches').classList.add('hidden');
                document.getElementById('view-standings').classList.remove('hidden');
                document.getElementById('nav-matches').className = 'flex flex-col items-center text-slate-400 text-xs font-semibold';
                document.getElementById('nav-standings').className = 'flex flex-col items-center text-sky-400 text-xs font-semibold';
                loadStandings(currentStandingsLeague);
            }
        }

        function toggleSettings() {
            document.getElementById('settings-panel').classList.toggle('hidden');
        }

        function saveFavTeam() {
            const team = document.getElementById('fav-input').value.trim();
            localStorage.setItem('favTeam', team);
            toggleSettings();
            renderMatches();
        }

        initDB();
    </script>
</body>
</html>
