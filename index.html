<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REALSPORTS - Custom Live Scores</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 650px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        header h1 { color: #38bdf8; font-size: 1.8rem; }
        .settings-btn { background: #334155; color: #fff; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }

        /* Pinned Team Section */
        .pin-card { background: linear-gradient(135deg, #1e1b4b, #312e81); border: 2px solid #6366f1; border-radius: 12px; padding: 15px; margin-bottom: 20px; }
        .pin-header { display: flex; justify-content: space-between; align-items: center; color: #fbbf24; font-size: 0.85rem; font-weight: bold; margin-bottom: 10px; }

        /* Controls & Filter Modal */
        .filter-panel { background: #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: none; }
        .filter-panel.active { display: block; }
        .filter-group { margin-bottom: 10px; }
        .filter-group label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 5px; }
        .filter-group input, .filter-group select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; }

        /* League Tabs */
        .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
        .tab-btn { background: #1e293b; color: #94a3b8; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-size: 0.85rem; }
        .tab-btn.active { background: #0284c7; color: white; font-weight: bold; }

        /* Match Card */
        .match-card { background: #1e293b; border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        .team { display: flex; align-items: center; gap: 10px; flex: 1; }
        .team.away { justify-content: flex-end; }
        .team img { width: 24px; height: 24px; object-fit: contain; }
        .score-box { background: #0f172a; padding: 6px 14px; border-radius: 6px; text-align: center; min-width: 70px; }
        .score { font-size: 1.1rem; font-weight: bold; color: #38bdf8; }
        .status { font-size: 0.7rem; color: #94a3b8; }
        .status.live { color: #ef4444; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>REALSPORTS</h1>
        <button class="settings-btn" onclick="toggleSettings()">⚙️ เลือกทีม/ลีกโปรด</button>
    </header>

    <!-- เมนูตั้งค่า เลือกทีมโปรดเอง -->
    <div id="settings-panel" class="filter-panel">
        <div class="filter-group">
            <label>พิมพ์ชื่อทีมโปรดที่ต้องการปักหมุดบนสุด:</label>
            <input type="text" id="favorite-team-input" placeholder="เช่น Real Madrid, Arsenal, Barcelona..." onchange="saveFavoriteTeam(this.value)">
        </div>
    </div>

    <!-- ส่วนปักหมุดทีมโปรด -->
    <div class="pin-card">
        <div class="pin-header">
            <span>📌 ทีมโปรดของคุณ: <span id="fav-team-name" style="color:#fff;">ยังไม่ได้เลือก</span></span>
        </div>
        <div id="pinned-match-container">
            <div style="text-align: center; color: #94a3b8; font-size: 0.85rem;">ไม่มีการแข่งขันวันนี้</div>
        </div>
    </div>

    <!-- รายการแข่งขัน -->
    <div class="tabs" id="league-tabs">
        <button class="tab-btn active" onclick="filterLeague('ALL')">ทั้งหมด</button>
    </div>

    <div id="match-list"></div>
</div>

<script>
    let favoriteTeam = localStorage.getItem('favTeam') || 'Real Madrid';
    
    document.getElementById('favorite-team-input').value = favoriteTeam;
    document.getElementById('fav-team-name').innerText = favoriteTeam;

    function toggleSettings() {
        const panel = document.getElementById('settings-panel');
        panel.classList.toggle('active');
    }

    function saveFavoriteTeam(teamName) {
        favoriteTeam = teamName;
        localStorage.setItem('favTeam', teamName);
        document.getElementById('fav-team-name').innerText = teamName;
        // โหลดข้อมูลใหม่ตามทีมโปรด
    }

    function filterLeague(leagueName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        // กรองข้อมูลลีกตามที่เลือก
    }
</script>

</body>
</html>
