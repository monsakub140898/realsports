<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REALSPORTS - Live Scores & Standings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { createClient } from "https://esm.sh/@libsql/client@0.6.0/web";
        window.createLibsqlClient = createClient;
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased pb-24">

    <!-- Top Navigation Bar -->
    <header class="sticky top-0 z-50 bg-slate-900/95 backdrop-blur border-b border-slate-800 shadow-md">
        <div class="max-w-2xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-xl">⚽</span>
                <span class="text-lg font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-blue-500">REALSPORTS</span>
            </div>
            <button onclick="toggleSettings()" class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded-full border border-slate-700 transition">
                <span>⚙️</span>
                <span>ทีมโปรด</span>
            </button>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-3 pt-4 space-y-4">

        <!-- Fav Team Settings Panel -->
        <div id="settings-panel" class="hidden bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3 shadow-lg">
            <div class="text-xs font-semibold text-slate-400">ปักหมุดทีมที่ต้องการติดตาม</div>
            <div class="flex gap-2">
                <input type="text" id="fav-input" placeholder="ค้นหาชื่อทีม เช่น Arsenal, Real Madrid" 
                       class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-500">
                <button onclick="saveFavTeam()" class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold text-xs px-4 rounded-xl transition">บันทึก</button>
            </div>
        </div>

        <!-- TAB 1: MATCHES VIEW -->
        <div id="view-matches" class="space-y-3">
            
            <!-- Date Filter Bar (เมื่อวาน / วันนี้ / พรุ่งนี้) -->
            <div class="grid grid-cols-3 gap-1 bg-slate-900 p-1 rounded-xl border border-slate-800/80 text-xs text-center font-medium">
                <button id="date-yesterday" onclick="changeDate('yesterday')" class="py-2 rounded-lg text-slate-400 hover:text-white transition">เมื่อวาน</button>
                <button id="date-today" onclick="changeDate('today')" class="py-2 rounded-lg bg-sky-500 text-slate-950 font-bold transition">วันนี้</button>
                <button id="date-tomorrow" onclick="changeDate('tomorrow')" class="py-2 rounded-lg text-slate-400 hover:text-white transition">พรุ่งนี้</button>
            </div>

            <!-- League Filter Tabs -->
            <div id="league-filters" class="flex gap-1.5 overflow-x-auto no-scrollbar py-1 text-xs"></div>

            <!-- Pinned Matches -->
            <div id="pinned-container" class="bg-gradient-to-r from-amber-950/30 to-amber-900/10 border border-amber-500/30 rounded-2xl p-3 hidden space-y-2">
                <div class="text-[11px] font-bold text-amber-400 flex items-center gap-1">📌 ทีมโปรดของคุณ</div>
                <div id="pinned-matches" class="space-y-2"></div>
            </div>

            <!-- Main Matches List -->
            <div id="matches-container" class="space-y-2">
                <div class="text-center py-12 text-slate-500 text-sm">กำลังเชื่อมต่อระบบข้อมูล...</div>
            </div>
        </div>

        <!-- TAB 2: STANDINGS VIEW -->
        <div id="view-standings" class="hidden space-y-3">
            <div id="standings-tabs" class="flex gap-1.5 overflow-x-auto no-scrollbar py-1 text-xs"></div>

            <div class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden shadow-sm">
                <table class="w-full text-left text-xs">
                    <thead class="bg-slate-950 text-slate-400 border-b border-slate-800 font-semibold uppercase tracking-wider">
                        <tr>
                            <th class="p-3 text-center w-8">#</th>
                            <th class="p-3">ทีม</th>
                            <th class="p-3 text-center">แข่ง</th>
                            <th class="p-3 text-center">GD</th>
                            <th class="p-3 text-center text-sky-400">แต้ม</th>
                        </tr>
                    </thead>
                    <tbody id="standings-body" class="divide-y divide-slate-800/60">
                        <tr><td colspan="5" class="text-center py-8 text-slate-500">กำลังโหลดข้อมูล...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Bottom Fixed Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/90 backdrop-blur border-t border-slate-800/80 z-50">
        <div class="max-w-2xl mx-auto flex justify-around p-2">
            <button id="nav-matches" onclick="switchTab('matches')" class="flex flex-col items-center py-1 px-4 text-sky-400 text-[11px] font-semibold">
                <span class="text-base mb-0.5">⚽</span> ผลบอล
            </button>
            <button id="nav-standings" onclick="switchTab('standings')" class="flex flex-col items-center py-1 px-4 text-slate-400 text-[11px] font-semibold">
                <span class="text-base mb-0.5">📊</span> ตารางคะแนน
            </button>
        </div>
    </nav>

    <script>
        const TURSO_URL = "https://realsports-db-pponnsp.aws-ap-northeast-1.turso.io";
        const TURSO_TOKEN = "ใส่_READ_ONLY_TOKEN_ตรงนี้";

        let db = null;
        let allMatches = [];
        let selectedLeague = 'ALL';
        let currentStandingsLeague = 'PL';
        let selectedDateMode = 'today'; // 'yesterday', 'today', 'tomorrow'

        async function initDB() {
            if (window.createLibsqlClient) {
                db = window.createLibsqlClient({ url: TURSO_URL, authToken: TURSO_TOKEN });
                renderLeagueFilters();
                await fetchRealMatches();
            } else {
                setTimeout(initDB, 200);
            }
        }

        function getTargetDateStr(mode) {
            const d = new Date();
            if (mode === 'yesterday') d.setDate(d.getDate() - 1);
            if (mode === 'tomorrow') d.setDate(d.getDate() + 1);
            return d.toISOString().split('T')[0];
        }

        async function fetchRealMatches() {
    const targetDate = getTargetDateStr(selectedDateMode);
    try {
        // ดึงตามวันที่เลือกก่อน
        let res = await db.execute({
            sql: "SELECT * FROM matches WHERE match_date = ? ORDER BY id DESC",
            args: [targetDate]
        });
        
        // ถ้าวันที่เลือกไม่มีข้อมูล ให้ดึงแมตช์ทั้งหมดที่มีในระบบมาโชว์แทนเพื่อความชัวร์
        if (res.rows.length === 0) {
            res = await db.execute("SELECT * FROM matches ORDER BY id DESC LIMIT 50");
        }

        allMatches = res.rows;
        renderMatches();
    } catch (err) {
        console.error("Fetch matches error:", err);
        document.getElementById('matches-container').innerHTML = 
            `<div class="text-center py-12 text-slate-500 text-sm">ไม่พบข้อมูลในระบบ (กรุณารัน GitHub Action)</div>`;
    }
}

        function changeDate(mode) {
            selectedDateMode = mode;
            ['yesterday', 'today', 'tomorrow'].forEach(m => {
                const btn = document.getElementById(`date-${m}`);
                if (m === mode) {
                    btn.className = "py-2 rounded-lg bg-sky-500 text-slate-950 font-bold transition";
                } else {
                    btn.className = "py-2 rounded-lg text-slate-400 hover:text-white transition";
                }
            });
            fetchRealMatches();
        }

        function renderLeagueFilters() {
            const leagues = [
                { code: 'ALL', name: 'ทั้งหมด' },
                { code: 'Premier League', name: 'พรีเมียร์ลีก' },
                { code: 'La Liga', name: 'ลาลีกา' },
                { code: 'Bundesliga', name: 'บุนเดสลีกา' },
                { code: 'Serie A', name: 'กัลโช่' },
                { code: 'Ligue 1', name: 'ลีกเอิง' }
            ];

            const container = document.getElementById('league-filters');
            container.innerHTML = leagues.map(l => `
                <button onclick="filterByLeague('${l.code}')" 
                        class="px-3 py-1.5 rounded-xl whitespace-nowrap text-xs transition ${selectedLeague === l.code ? 'bg-sky-500/10 text-sky-400 font-bold border border-sky-500/30' : 'bg-slate-900 text-slate-400 border border-slate-800 hover:bg-slate-800'}">
                    ${l.name}
                </button>
            `).join('');
        }

        function filterByLeague(code) {
            selectedLeague = code;
            renderLeagueFilters();
            renderMatches();
        }

        function renderMatches() {
            const favTeam = localStorage.getItem('favTeam')?.toLowerCase();
            const container = document.getElementById('matches-container');
            const pinnedContainer = document.getElementById('pinned-container');
            const pinnedMatchesDiv = document.getElementById('pinned-matches');

            let pinned = (favTeam && allMatches.length > 0) 
                ? allMatches.filter(m => m.home_team.toLowerCase().includes(favTeam) || m.away_team.toLowerCase().includes(favTeam)) 
                : [];

            if (pinned.length > 0) {
                pinnedContainer.classList.remove('hidden');
                pinnedMatchesDiv.innerHTML = pinned.map(createMatchCard).join('');
            } else {
                pinnedContainer.classList.add('hidden');
            }

            let filteredMatches = allMatches;
            if (selectedLeague !== 'ALL') {
                filteredMatches = allMatches.filter(m => m.league_name === selectedLeague);
            }

            if (filteredMatches.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-500 text-sm">ไม่มีรายการแข่งขันในวันนี้</div>`;
            } else {
                container.innerHTML = filteredMatches.map(createMatchCard).join('');
            }
        }

        function createMatchCard(m) {
            const isLive = m.status === 'IN_PLAY' || m.status === 'PAUSED';
            const isFinished = m.status === 'FINISHED';
            
            let statusBadge = `<span class="text-slate-400">${m.match_time || 'VS'}</span>`;
            if (isLive) statusBadge = `<span class="text-emerald-400 font-bold animate-pulse">● LIVE</span>`;
            if (isFinished) statusBadge = `<span class="text-slate-500 font-medium">FT</span>`;

            return `
                <div class="bg-slate-900 border border-slate-800/80 rounded-xl p-3 flex items-center justify-between hover:border-slate-700 transition">
                    <div class="text-[11px] text-slate-400 w-24 truncate font-medium">${m.league_name}</div>
                    
                    <div class="flex-1 grid grid-cols-3 items-center text-center px-2">
                        <span class="text-xs font-semibold text-right truncate ${m.home_score > m.away_score ? 'text-white font-bold' : 'text-slate-300'}">${m.home_team}</span>
                        <div class="mx-auto bg-slate-950 px-2.5 py-1 rounded-lg border border-slate-800 text-xs font-mono font-bold text-sky-400">
                            ${m.home_score ?? 0} - ${m.away_score ?? 0}
                        </div>
                        <span class="text-xs font-semibold text-left truncate ${m.away_score > m.home_score ? 'text-white font-bold' : 'text-slate-300'}">${m.away_team}</span>
                    </div>

                    <div class="text-[11px] w-12 text-right">
                        ${statusBadge}
                    </div>
                </div>
            `;
        }

        function renderStandingsTabs() {
            const leagues = [
                { code: 'PL', name: 'พรีเมียร์ลีก' },
                { code: 'PD', name: 'ลาลีกา' },
                { code: 'BL1', name: 'บุนเดสลีกา' },
                { code: 'SA', name: 'กัลโช่' },
                { code: 'FL1', name: 'ลีกเอิง' }
            ];

            const container = document.getElementById('standings-tabs');
            container.innerHTML = leagues.map(l => `
                <button onclick="loadStandings('${l.code}')" 
                        class="px-3 py-1.5 rounded-xl whitespace-nowrap text-xs transition ${currentStandingsLeague === l.code ? 'bg-sky-500/10 text-sky-400 font-bold border border-sky-500/30' : 'bg-slate-900 text-slate-400 border border-slate-800 hover:bg-slate-800'}">
                    ${l.name}
                </button>
            `).join('');
        }

        async function loadStandings(leagueCode) {
            currentStandingsLeague = leagueCode;
            renderStandingsTabs();

            const body = document.getElementById('standings-body');
            body.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-slate-500">กำลังโหลดข้อมูล...</td></tr>`;

            try {
                const res = await db.execute({
                    sql: "SELECT * FROM standings WHERE league_code = ? ORDER BY position ASC",
                    args: [leagueCode]
                });
                
                if (res.rows.length === 0) {
                    body.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-slate-500">ยังไม่มีข้อมูลตารางคะแนน</td></tr>`;
                    return;
                }

                body.innerHTML = res.rows.map(row => `
                    <tr class="hover:bg-slate-800/40 transition">
                        <td class="p-3 text-center font-bold ${row.position <= 4 ? 'text-sky-400' : 'text-slate-500'}">${row.position}</td>
                        <td class="p-3 font-semibold text-slate-200">${row.team_name}</td>
                        <td class="p-3 text-center text-slate-400">${row.played}</td>
                        <td class="p-3 text-center text-slate-400">${row.goals_for - row.goals_against}</td>
                        <td class="p-3 text-center font-bold text-sky-400">${row.points}</td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error("Fetch standings error:", err);
            }
        }

        function switchTab(tab) {
            if (tab === 'matches') {
                document.getElementById('view-matches').classList.remove('hidden');
                document.getElementById('view-standings').classList.add('hidden');
                document.getElementById('nav-matches').className = 'flex flex-col items-center py-1 px-4 text-sky-400 text-[11px] font-semibold';
                document.getElementById('nav-standings').className = 'flex flex-col items-center py-1 px-4 text-slate-400 text-[11px] font-semibold';
            } else {
                document.getElementById('view-matches').classList.add('hidden');
                document.getElementById('view-standings').classList.remove('hidden');
                document.getElementById('nav-matches').className = 'flex flex-col items-center py-1 px-4 text-slate-400 text-[11px] font-semibold';
                document.getElementById('nav-standings').className = 'flex flex-col items-center py-1 px-4 text-sky-400 text-[11px] font-semibold';
                loadStandings(currentStandingsLeague);
            }
        }

        function toggleSettings() {
            document.getElementById('settings-panel').classList.toggle('hidden');
        }

        function saveFavTeam() {
            const team = document.getElementById('fav-input').value.trim();
            localStorage.setItem('favTeam', team);
            toggleSettings();
            renderMatches();
        }

        initDB();
    </script>
</body>
</html>
